spring:
  application:
    name: dot-tracker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 90d
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 90d

management:
  endpoints:
    web:
      exposure:
        include: health
