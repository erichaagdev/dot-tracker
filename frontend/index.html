<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Dot Tracker</title>
    <meta name="theme-color" content="#F7F8FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161922" media="(prefers-color-scheme: dark)" />
    <script>
      // Applies the theme picked on Account before the first paint, the same way src/lib/theme.svelte.js does
      try {
        const choice = JSON.parse(localStorage.getItem('dot-tracker.theme'))
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.dataset.theme = choice
          const picked = document.createElement('meta')
          picked.name = 'theme-color'
          picked.content = document.querySelector(`meta[name="theme-color"][media="(prefers-color-scheme: ${choice})"]`).content
          document.querySelector('meta[name="theme-color"]').before(picked)
        }
      } catch {
        // With storage blocked the device's setting stands
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/brand.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
