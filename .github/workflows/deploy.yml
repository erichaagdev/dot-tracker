name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Node from mise.toml
        uses: jdx/mise-action@v5
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build, test and build the image
        run: ./gradlew build bootBuildImage
      # Workload identity federation trades this run's GitHub token for a Google one, so no key is stored. The provider
      # only accepts runs on main of this repository.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/dot-tracker
          service_account: dot-tracker-deploy@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/dot-tracker/dot-tracker:$(git rev-parse --short HEAD)"
          docker tag dot-tracker:latest "$IMAGE"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      # Only the image changes. Every other setting carries over from the running revision.
      - name: Deploy
        run: gcloud run deploy dot-tracker --image="$IMAGE" --region="$REGION" --quiet
